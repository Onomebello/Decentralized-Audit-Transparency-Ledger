groups:
  - name: audit_ledger
    rules:
      - alert: StorageNearCapacity
        expr: audit_ledger_storage_usage_percent > 90
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AuditLedger storage near capacity"
          description: "Storage usage is {{ $value | printf \"%.1f\" }}% (threshold: 90%)."

      - alert: UnusualEventVolumeSpike
        expr: rate(audit_ledger_total_events[5m]) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Unusual event volume spike detected"
          description: "Event rate is {{ $value | printf \"%.2f\" }} events/s over the last 5 minutes."

      - alert: NoEventsLoggedFor1Hour
        expr: increase(audit_ledger_total_events[1h]) == 0
        for: 60m
        labels:
          severity: warning
        annotations:
          summary: "No events logged for 1 hour"
          description: "Zero new events have been logged in the past hour — potential contract or feeder issue."

      - alert: ContractPausedUnexpectedly
        expr: audit_ledger_global_max_logs == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AuditLedger contract appears paused"
          description: "global_max_logs is 0, blocking all new event logging."

      - alert: AuditLedgerPaused
        expr: audit_ledger_governance_paused == 1
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "AuditLedger contract has been paused for > 30 minutes"
          description: "Contract has been paused. All write operations are blocked."

      - alert: HighScrapeErrorRate
        expr: rate(audit_ledger_error_total[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate in metrics exporter"
          description: "Exporter error rate is {{ $value | printf \"%.2f\" }} errors/s."

      - alert: ScrapeFailing
        expr: audit_ledger_scrape_error == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Metrics exporter scrape failing"
          description: "Exporter has been failing consecutively for contract {{ $labels.contract_id }}."

      - alert: HighQueryLatency
        expr: histogram_quantile(0.95, rate(audit_ledger_query_duration_ms_bucket[5m])) > 3000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High query latency on contract {{ $labels.contract_id }}"
          description: "P95 query latency is {{ $value | printf \"%.0f\" }}ms."

      - alert: OwnershipChanged
        expr: changes(audit_ledger_governance_owners[5m]) > 0
        labels:
          severity: info
        annotations:
          summary: "Contract ownership changed"
          description: "Number of contract owners changed to {{ $value }}."

      - alert: ContractUnpaused
        expr: changes(audit_ledger_governance_paused[5m]) > 0 and audit_ledger_governance_paused == 0
        labels:
          severity: info
        annotations:
          summary: "Contract has been unpaused"
          description: "The AuditLedger contract is now active again."
